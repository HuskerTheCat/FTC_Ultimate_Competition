<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1221" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://huskerthecat.github.io https://*.googleapis.com https://api.github.com ws://localhost:* ws://127.0.0.1:* http://127.0.0.1:9099 http://127.0.0.1:8080; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'" />

    <link rel="stylesheet" href="/src/style.css" />

  <body>
    <p class="status-banner">This app is still under development</p>
    <p id="offline-banner" class="status-banner offline" role="status" hidden>Offline, changes will sync when you reconnect</p>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
