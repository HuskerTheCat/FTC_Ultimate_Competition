<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1221" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.ftcscout.org https://huskerthecat.github.io https://*.googleapis.com https://api.github.com ws://localhost:* ws://127.0.0.1:* http://127.0.0.1:9099 http://127.0.0.1:8080; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'" />
    <title>FTC Ultimate Competition</title>
    <meta name="description" content="Free competition app for FTC robotics teams: scouting, routes and team pages." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- The loading screen's font and contour lines (#switching), fetched with the stylesheet so it shows complete from its first paint. -->
    <link rel="preload" href="/node_modules/@fontsource/orbitron/files/orbitron-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/orbitron/files/orbitron-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/topo.svg" as="image" crossorigin />
    <script src="switching.js"></script>
  </head>
  <body>
    <p class="status-banner">This app is still under development</p>
    <p id="offline-banner" class="status-banner offline" role="status" hidden>Offline, changes will sync when you reconnect</p>
    <button id="rules-banner" class="status-banner" hidden>Your Firebase rules are out of date, click for update instructions</button>
    <button id="open-rules-banner" class="status-banner danger" hidden>Your Firebase is configured incorrectly and your account is not secure. Click here to fix</button>
    <a id="demo-banner" class="status-banner demo" href="./" hidden>Demo only. Click to set up an account</a>
    <div id="app"></div>
    <div id="switching" data-app="competition" aria-hidden="true"><img src="loading.svg" alt="" /><p><span class="name">FTC Ultimate</span><span class="app-name">Competition</span></p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
