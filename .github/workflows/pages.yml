name: Publish website

# Main is the website itself, locked until the app is ready (VITE_LOCKED, see src/main.js). Every other branch is an
# unlocked test copy at branch/<name>/, so changes can be tried on a phone before they're merged. Pages holds one
# site, so each run builds them all.
on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every branch, and the tags for the version below
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main and every branch
        run: |
          site="$RUNNER_TEMP/site"
          build() {
            git checkout -q -f "origin/$1"
            npm ci
            # Latest release plus commits since, e.g. 0.4.0-11-g1796556, shown in bug reports.
            npm pkg set version=$(git describe --tags | sed 's/^v//')
            VITE_LOCKED=$3 npx vite build --outDir "$2" --emptyOutDir
          }
          build main "$site" true
          for branch in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            [ "$branch" = main ] || [ "$branch" = HEAD ] || build "$branch" "$site/branch/$branch"
          done
          echo "SITE=$site" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE }}
      - id: deployment
        uses: actions/deploy-pages@v4
