name: Android test APK

# Builds an Android APK from this branch, signed with the same sideload key as the PC build
# (secrets set by set-github-secrets.ps1), and publishes it as a GitHub pre-release.
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build website
        run: |
          npm ci
          npx vite build
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
          npm install --no-save @capacitor/cli@8.6.0 @capacitor/core@8.6.0 @capacitor/android@8.6.0
          npx cap init "FTC Competition" com.huskerthecat.ftcultimate.competition --web-dir dist
          npx cap add android
          # Each run gets a higher versionCode so phones accept it as an update.
          sed -i "s/versionCode 1$/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          cd android && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-test-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk FTC-Competition.apk
          gh release create "$tag" FTC-Competition.apk --target "$GITHUB_SHA" --prerelease \
            --title "Android test build $(date -u +%Y-%m-%d)" \
            --notes "Test APK built from main (${GITHUB_SHA::7}), signed with the same key as the PC build, so it updates the installed app."
