name: Android test APK

# Builds a debug-signed Android APK from this branch and publishes it as a GitHub pre-release.
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build website
        run: |
          npm ci
          npx vite build
      - name: Build APK
        run: |
          npm install --no-save @capacitor/cli@7.4.0 @capacitor/core@7.4.0 @capacitor/android@7.4.0
          npx cap init "FTC Competition" com.huskerthecat.ftccompetition --web-dir dist
          npx cap add android
          cd android && ./gradlew assembleDebug
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-test-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk FTC-Competition.apk
          gh release create "$tag" FTC-Competition.apk --target "$GITHUB_SHA" --prerelease \
            --title "Android test build $(date -u +%Y-%m-%d)" \
            --notes "Debug-signed test APK built from main (${GITHUB_SHA::7}). Uninstall the older test app first if Android refuses to update it."
